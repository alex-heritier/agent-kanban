<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: canvas;
        color: canvasText;
      }
      main {
        text-align: center;
      }
      code {
        background: color-mix(in oklab, canvasText 12%, canvas);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to your Electron app</h1>
      <p>Edit <code>src/index.html</code> to get started.</p>
    </main>
  </body>
</html>
