<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TASKS.md Kanban</title>
    <style>
      :root {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        color-scheme: light;
        --bg: #f6f8fc;
        --surface: #ffffff;
        --surface-muted: #f8faff;
        --text: #1b2333;
        --text-subtle: #5a6476;
        --border: #dfe5f2;
        --shadow: 0 10px 24px rgba(18, 30, 62, 0.08);
        --accent: #4f7cff;
        --accent-soft: #e9efff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 50%);
        color: var(--text);
      }

      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title {
        margin: 0;
        font-size: 1.12rem;
        font-weight: 700;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(220px, 1fr));
        gap: 0.85rem;
        padding: 1rem;
      }

      .col {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        min-height: 68vh;
        box-shadow: var(--shadow);
      }

      .col-header {
        margin: 0;
        padding: 0.75rem 0.8rem;
        font-size: 0.93rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-subtle);
      }

      .badge {
        border-radius: 999px;
        background: var(--accent-soft);
        color: #2847a6;
        border: 1px solid #cfdbff;
        font-size: 0.74rem;
        font-weight: 600;
        padding: 0.15rem 0.5rem;
      }

      .cards {
        padding: 0.65rem;
        min-height: 60vh;
      }

      .card {
        padding: 0.7rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 0.55rem;
        background: var(--surface-muted);
        cursor: grab;
        box-shadow: 0 3px 10px rgba(20, 38, 90, 0.06);
      }

      .card:hover { border-color: #c8d4ef; }
      .card b { display: block; margin-bottom: 0.3rem; font-size: 0.92rem; }

      .drop {
        outline: 2px dashed var(--accent);
        outline-offset: -5px;
        border-radius: 10px;
        background: #f3f7ff;
      }

      .controls { display: flex; gap: 0.5rem; align-items: center; }

      button,
      input {
        background: var(--surface);
        color: var(--text);
        border: 1px solid #cfd8ee;
        border-radius: 10px;
        padding: 0.48rem 0.65rem;
        font-size: 0.9rem;
      }

      input { min-width: 250px; }

      button {
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        color: #ffffff;
        border-color: #3f69e8;
      }

      button:hover { filter: brightness(0.98); }

      .small { color: var(--text-subtle); font-size: 0.84rem; }
      #status { padding: 0 1rem 1rem; }

      @media (max-width: 1200px) {
        .board { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
      }
      @media (max-width: 700px) {
        header { flex-direction: column; align-items: flex-start; }
        .controls { width: 100%; flex-wrap: wrap; }
        input { min-width: 100%; }
        .board { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 class="title">Repo-native TASKS.md Kanban</h1>
        <div class="small">Source of truth: &lt;repo&gt;/TASKS.md</div>
      </div>
      <div class="controls">
        <input id="newTitle" placeholder="New task title" />
        <button class="primary" id="createBtn">Create</button>
        <button id="lintBtn">Lint</button>
      </div>
    </header>
    <main class="board" id="board"></main>
    <div id="status" class="small"></div>

    <script>
      const cols = [
        ['todo', 'Todo'],
        ['in_progress', 'In Progress'],
        ['blocked', 'Blocked'],
        ['done', 'Done'],
        ['cancelled', 'Cancelled']
      ];
      const board = document.getElementById('board');
      const statusEl = document.getElementById('status');
      let tasks = [];

      function card(t) {
        const el = document.createElement('article');
        el.className = 'card';
        el.draggable = true;
        el.dataset.id = t.id;
        el.innerHTML = `<b>${t.id} ${t.title}</b><div class="small">Owner: ${t.metadata.Owner || 'unassigned'} · Priority: ${t.metadata.Priority || 'medium'}</div>`;
        el.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', t.id));
        return el;
      }

      function render() {
        board.innerHTML = '';
        for (const [status, label] of cols) {
          const column = document.createElement('section');
          column.className = 'col';
          const inCol = tasks.filter((x) => (x.metadata.Status || 'todo') === status);
          column.innerHTML = `<h2 class="col-header"><span>${label}</span><span class="badge">${inCol.length}</span></h2><div class="cards"></div>`;
          const cardsEl = column.querySelector('.cards');
          for (const t of inCol) cardsEl.append(card(t));
          cardsEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            cardsEl.classList.add('drop');
          });
          cardsEl.addEventListener('dragleave', () => cardsEl.classList.remove('drop'));
          cardsEl.addEventListener('drop', async (e) => {
            e.preventDefault();
            cardsEl.classList.remove('drop');
            const id = e.dataTransfer.getData('text/plain');
            if (!window.tasksApi) return;
            await window.tasksApi.setStatus(id, status);
            await refresh();
          });
          board.append(column);
        }
      }

      async function refresh() {
        if (!window.tasksApi) {
          statusEl.textContent = 'Static mode: open in Electron to read/write TASKS.md.';
          tasks = [];
          render();
          return;
        }
        tasks = await window.tasksApi.list();
        render();
      }

      document.getElementById('createBtn').onclick = async () => {
        const title = document.getElementById('newTitle').value.trim();
        if (!title || !window.tasksApi) return;
        await window.tasksApi.create({ title, status: 'todo' });
        document.getElementById('newTitle').value = '';
        await refresh();
      };

      document.getElementById('lintBtn').onclick = async () => {
        if (!window.tasksApi) return;
        const res = await window.tasksApi.lint();
        statusEl.textContent = res.ok ? 'Lint passed.' : `Lint errors: ${res.errors.join(' | ')}`;
      };

      refresh();
    </script>
  </body>
</html>
